<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your project — Sarah J Hill</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Sarah J Hill palette. The accent is a darkened brand teal: the bright
   #07beb8 only reaches 2.3:1 on white and is not readable as text. */
:root{
  --bg:#F6F8F8; --surface:#fff; --sunken:#EDF1F1; --text:#15201F; --text-2:#54615F;
  --text-3:#84918F; --border:#DFE6E5; --strong:#C6D1D0;
  --accent:#08807C; --accent-bright:#07beb8;
  --ok:#1E7A5A; --ok-soft:#E3F3EC; --warn:#96700F; --warn-soft:#FAF1DA; --danger:#B02F2F;
  --display:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.55;font-size:16px;
 font-family:'Lato',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1140px;margin:0 auto;padding:36px 20px 90px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
 flex-wrap:wrap;margin-bottom:24px}
h1{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0 0 4px}
.sub{color:var(--text-2);margin:0;font-size:14px}

/* Two columns on a real screen: the project on the left, the
   conversation pinned on the right where it is always in view. */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.rail{position:sticky;top:16px}
.rail .card{margin-bottom:0}
.msgscroll{max-height:44vh;overflow-y:auto;overscroll-behavior:contain}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 14px;letter-spacing:.02em;text-transform:uppercase;
 color:var(--text-3);font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden;margin:6px 0 10px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-bright));
 border-radius:99px;transition:width .4s}
.pct{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stageline{font-size:13px;color:var(--text-3);margin:6px 0 0;letter-spacing:.02em;
 text-transform:uppercase;font-weight:700}
.phase{font-size:17px;margin:12px 0 4px;font-weight:700;font-family:var(--display);letter-spacing:-.01em}
.goal{color:var(--text-2);font-size:14.5px;margin:0}

/* Welcome */
.welcome h1{font-size:23px;margin-bottom:8px}
.welcome p{margin:0 0 10px;font-size:15.5px;color:var(--text-2)}
.welcome p:last-child{margin-bottom:0}
.note{background:var(--sunken);border-left:3px solid var(--accent);padding:14px 16px;
 border-radius:0 10px 10px 0;font-size:15px;margin:0;white-space:pre-wrap}
.noteempty{border-left-color:var(--strong);color:var(--text-3);font-style:italic}

.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .ic{width:26px;height:26px;border-radius:8px;background:var(--sunken);display:grid;
 place-items:center;font-size:13px;flex:0 0 auto;color:var(--text-2)}
.row .ic.done{background:var(--ok-soft);color:var(--ok)}
.row .ic.late{background:var(--warn-soft);color:var(--warn)}
.row .body{flex:1;min-width:0}
.row .body strong{display:block;font-size:15px}
.row .body .d{color:var(--text-2);font-size:13.5px;margin-top:2px}
.row .when{font-size:12.5px;color:var(--text-3);flex:0 0 auto;text-align:right}
.done-row strong{text-decoration:line-through;color:var(--text-3)}

/* The journey */
.step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:0}
.step .num{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
 font-size:13px;font-weight:700;background:var(--sunken);color:var(--text-3);
 font-family:var(--display)}
.step.done .num{background:var(--ok-soft);color:var(--ok)}
.step.current .num{background:var(--accent);color:#fff}
.step .t{font-size:16px;font-weight:700;font-family:var(--display);letter-spacing:-.01em;
 margin:2px 0 0;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.step.done .t{color:var(--text-2)}
.step .did{color:var(--text-2);font-size:14.5px;margin:5px 0 0}
.step .yours{margin:9px 0 0;font-size:14.5px;padding:9px 12px;border-radius:9px;
 background:var(--sunken)}
.step .yours b{font-family:var(--display);font-size:12.5px;text-transform:uppercase;
 letter-spacing:.03em;color:var(--accent);display:block;margin-bottom:2px}
.step .yours.none{background:transparent;padding:6px 0 0;color:var(--text-3);font-size:13.5px}

button.btn{padding:11px 18px;border-radius:10px;border:1px solid var(--strong);
 background:var(--surface);font:inherit;cursor:pointer}
button.btn:hover{background:var(--sunken)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.07)}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--strong);border-radius:9px;font:inherit;
 background:var(--surface)}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.msgrow{padding:10px 0;border-bottom:1px solid var(--border)}
.msgrow:last-child{border-bottom:0}
.msgrow .who{font-size:12.5px;color:var(--text-3);margin-bottom:2px}
.msgrow.mine{text-align:right}
.cuitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.cuitem:last-child{border-bottom:0}
.signin{max-width:440px;margin:60px auto}
.msg{font-size:14px;color:var(--text-2);margin-top:14px}
.err{color:var(--danger)}
.empty{color:var(--text-3);font-size:14px}
.tiny{font-size:12.5px;color:var(--text-3)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.slipped{background:var(--warn-soft);color:var(--warn)}
.pill.planned{background:var(--sunken);color:var(--text-2)}
.pill.now{background:var(--accent);color:#fff}
.pill.soon{background:var(--sunken);color:var(--text-3)}
details{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;
 background:var(--surface)}
summary{cursor:pointer;font-weight:600;font-size:14.5px}
details table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
details td{border-top:1px solid var(--border);padding:7px 6px;vertical-align:top}
details td:first-child{width:40%;color:var(--text-2)}
footer{text-align:center;color:var(--text-3);font-size:12.5px;margin-top:34px}

@media(max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .rail .card{margin-bottom:16px}
  .msgscroll{max-height:none}
}
@media(max-width:600px){.wrap{padding:24px 14px 70px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="signin card">
    <h1 style="margin-bottom:8px">Your project</h1>
    <p class="sub">Loading…</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/data-journey.js"></script>
<script src="js/cloud.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function d(x){ if(!x) return ''; var t=new Date(x); return isNaN(t)?String(x):
    t.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }

  /* "Kay Williams" -> "Kay". Used only to make the welcome sound like a
     person wrote it. Falls back to no name at all rather than guessing. */
  function firstName(s){
    s = String(s || '').trim();
    if (!s) return '';
    var bit = s.split(/[\s,]+/)[0];
    return (bit && bit.length < 20) ? bit : '';
  }

  function isPreview(){
    try { return !!new URLSearchParams(location.search).get('preview'); }
    catch (e) { return false; }
  }

  function journey(id, fallback){
    return (window.journeyFor ? window.journeyFor(id, fallback)
      : { name: fallback || 'This stage', did: '', needs: false, you: '' });
  }

  /* Snapshots published before the journey existed carry no phases array,
     only the old progress block. Rebuild the stage list from that rather
     than showing nothing — and never treat missing data as "finished",
     which is what an earlier version of this page did.

     The old block gives phaseNum (the index of the stage in flight) and
     phaseTotal. A genuinely finished project is the one case where the
     app wrote phaseName: 'Complete'. */
  function inferPhases(pr) {
    if (!pr || !pr.phaseTotal) return null;
    /* Only for a client website project. Everything else keeps its own
       phase names and gets no invented journey. */
    if (!(window.isClientTrackSnapshot && window.isClientTrackSnapshot(pr))) return null;
    var total = pr.phaseTotal;
    var finished = pr.phaseName === 'Complete';
    var curNum = typeof pr.phaseNum === 'number' ? pr.phaseNum : null;
    if (!finished && curNum === null) return null;   // not enough to say anything honest

    var out = [];
    for (var i = 0; i < total; i++) {
      out.push({
        id: 'p' + i, num: i, name: 'Stage ' + (i + 1),
        done: 0, total: 0, pct: 0,
        state: finished ? 'done'
             : i < curNum ? 'done'
             : i === curNum ? 'current' : 'upcoming'
      });
    }
    return out;
  }

  function allComplete(phases) {
    return !!(phases && phases.length && phases.every(function (ph) {
      return ph.state === 'done';
    }));
  }

  function signInView(msg, isErr) {
    app.innerHTML =
      '<div class="signin card">' +
      '<h1 style="margin-bottom:6px">Your project</h1>' +
      '<p class="sub">Enter the email address your project contact used to invite you. ' +
      'We will send you a link that signs you in — there is no password.</p>' +
      '<div style="margin-top:18px"><input id="em" type="email" placeholder="you@example.com" autocomplete="email"></div>' +
      '<div style="margin-top:10px"><button type="button" class="btn primary" id="go" style="width:100%">Email me a sign-in link</button></div>' +
      '<p class="msg' + (isErr ? ' err' : '') + '" id="msg">' + (msg || '') + '</p></div>';

    document.getElementById('go').onclick = function () {
      var em = document.getElementById('em').value.trim();
      var m = document.getElementById('msg');
      if (!em) { m.textContent = 'Please enter your email address.'; m.className = 'msg err'; return; }
      m.className = 'msg'; m.textContent = 'Sending…';
      window.Cloud.signIn(em, location.href.split('#')[0]).then(function () {
        m.innerHTML = '<strong>Check your inbox.</strong> Click the link in the email and you will be signed in. ' +
          'It sometimes takes a minute, and the first one can land in spam.';
      }).catch(function (e) { m.className = 'msg err'; m.textContent = 'Could not send: ' + e.message; });
    };
    document.getElementById('em').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('go').click();
    });
  }

  function notInvited(email) {
    app.innerHTML = '<div class="signin card"><h1 style="margin-bottom:6px">Nothing shared yet</h1>' +
      '<p class="sub">You are signed in as <strong>' + esc(email) + '</strong>, but no project has been ' +
      'shared with this address.</p><p class="sub" style="margin-top:10px">If you were invited using a ' +
      'different email, sign out and try that one. Otherwise ask your project contact to check the address ' +
      'they invited.</p><div style="margin-top:18px"><button type="button" class="btn" id="out">Sign out</button></div></div>';
    document.getElementById('out').onclick = function () {
      window.Cloud.signOut().then(function () { signInView(); });
    };
  }

  /* ---------- the pieces of the page ---------- */

  function welcomeCard(proj, note) {
    var who = firstName(proj.client);
    var h = '<div class="card welcome">' +
      '<h1>' + (who ? 'Welcome, ' + esc(who) + '.' : 'Welcome.') + '</h1>' +
      '<p>This is your project page. It is private to you, and it is where you can see ' +
      'exactly what has been done so far, what happens next, and anything I need from you.</p>' +
      '<p>Nothing here is public, and you do not need a password — you sign in with a link sent ' +
      'to your email. Have a look round, and use the messages on this page whenever you want to ' +
      'ask something. There is no such thing as a daft question.</p>';

    if (note) {
      h += '<p style="margin-top:16px;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;' +
        'color:var(--text-3);font-weight:700">Latest update</p>' +
        '<p class="note">' + esc(note) + '</p>';
    } else if (isPreview()) {
      h += '<p style="margin-top:16px;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;' +
        'color:var(--text-3);font-weight:700">Latest update</p>' +
        '<p class="note noteempty">You have not written an update for this client yet. ' +
        'Add one in Clients &rarr; the note field, and it appears here. ' +
        'Your client does not see this box while it is empty.</p>';
    }
    return h + '</div>';
  }

  function progressCard(pr, phases) {
    var cur = null;
    (phases || []).forEach(function (ph) { if (!cur && ph.state === 'current') cur = ph; });

    var total = (phases && phases.length) || pr.phaseTotal || 0;
    var idx = 0;
    if (cur && phases) { phases.forEach(function (ph, i) { if (ph.id === cur.id) idx = i + 1; }); }

    var finished = allComplete(phases);
    var j = cur ? journey(cur.id, cur.name) : null;

    var h = '<div class="card"><h2>Progress</h2>' +
      '<div class="pct">' + (pr.pct || 0) + '%</div>' +
      '<div class="bar"><span style="width:' + (pr.pct || 0) + '%"></span></div>';

    /* Only ever claim a position we actually know. No stage data means no
       stage line — not an invented one, and never "complete". */
    var line = cur ? 'Stage ' + idx + ' of ' + total
             : finished ? 'All ' + total + ' stages complete'
             : '';
    if (line) h += '<p class="stageline">' + line + '</p>';

    if (j) {
      h += '<p class="phase">' + esc(j.name) + '</p>' +
        (j.did ? '<p class="goal">' + esc(j.did) + '</p>' : '');
    } else if (finished) {
      h += '<p class="phase">Finished</p>' +
        '<p class="goal">All the planned work on this project is done.</p>';
    } else {
      /* Only promise a stage list when there is actually one underneath.
         A project on a track with no journey (an audit, say) gets an
         honest line instead of pointing at nothing. */
      h += '<p class="phase">Under way</p>' +
        ((phases && phases.length)
          ? '<p class="goal">The stages below show what has been done and what is still to come.</p>'
          : '<p class="goal">Ask me any time for an update on where things stand — ' +
            'the messages box is right there.</p>');
    }
    return h + '</div>';
  }

  function doneCard(phases) {
    var done = (phases || []).filter(function (ph) { return ph.state === 'done'; });
    var h = '<div class="card"><h2>What has been done so far</h2>';
    if (!done.length) {
      h += '<p class="empty">We are right at the beginning — nothing finished to report yet. ' +
        'The stages below show what is coming.</p>';
      return h + '</div>';
    }
    h += done.map(function (ph) {
      var j = journey(ph.id, ph.name);
      return '<div class="row"><div class="ic done">✓</div><div class="body">' +
        '<strong>' + esc(j.name) + '</strong>' +
        (j.did ? '<div class="d">' + esc(j.did) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return h + '</div>';
  }

  function journeyCard(phases) {
    if (!phases || !phases.length) return '';
    var h = '<div class="card"><h2>The whole journey, and what you do</h2>' +
      '<p class="sub" style="margin:-6px 0 16px">Every stage of the project, start to finish, ' +
      'so you know what to expect and when you will be needed.</p>';

    h += phases.map(function (ph, i) {
      var j = journey(ph.id, ph.name);
      var pill = ph.state === 'done' ? '<span class="pill done">Done</span>'
               : ph.state === 'current' ? '<span class="pill now">Happening now</span>'
               : '<span class="pill soon">To come</span>';
      var mark = ph.state === 'done' ? '✓' : String(i + 1);

      return '<div class="step ' + ph.state + '">' +
        '<div class="num">' + mark + '</div>' +
        '<div class="body" style="flex:1;min-width:0">' +
        '<p class="t">' + esc(j.name) + ' ' + pill + '</p>' +
        (j.did ? '<p class="did">' + esc(j.did) + '</p>' : '') +
        (j.needs
          ? '<div class="yours"><b>What you do</b>' + esc(j.you) + '</div>'
          : (j.you ? '<div class="yours none">' + esc(j.you) + '</div>' : '')) +
        '</div></div>';
    }).join('');

    return h + '</div>';
  }

  function messagesCard(i) {
    return '<div class="card"><h2>Messages</h2>' +
      '<p class="sub" style="margin:-8px 0 12px">Ask me anything, any time.</p>' +
      '<div class="msgscroll" id="msgs-' + i + '"><p class="empty">Loading…</p></div>' +
      '<div style="margin-top:14px"><textarea id="msgBody-' + i + '" placeholder="Write a message…"></textarea>' +
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button type="button" class="btn primary" id="msgSend-' + i + '">Send</button>' +
      '<button type="button" class="btn" id="msgAttach-' + i + '">Attach a file</button>' +
      '<input type="file" id="msgFile-' + i + '" style="display:none"></div>' +
      '<div id="cuList-' + i + '" style="margin-top:10px"></div></div></div>';
  }

  /* ---------- the page ---------- */

  function render(rows, snapshots) {
    var html = '';

    rows.forEach(function (row, i) {
      var snap = snapshots[i];
      var p = (snap && snap.payload) || {};
      var sec = p.sections || {};
      var proj = p.project || {};

      html += '<header class="top"><div>' +
        '<h1>' + esc(proj.name || 'Your project') + '</h1>' +
        '<p class="sub">Last updated ' + esc(d(proj.updated || (snap && snap.published_at))) + '</p>' +
        '</div><button type="button" class="btn" id="out">Sign out</button></header>';

      if (!snap) {
        html += '<div class="card"><p class="empty">Your project contact has not published an update yet. ' +
          'Check back shortly.</p></div>';
        return;
      }

      var main = '';

      main += welcomeCard(proj, p.note || '');

      /* New snapshots carry the stage list. Older ones are rebuilt from the
         progress block so a client who has not had an update published since
         the journey shipped still sees a truthful page. */
      var phases = (p.phases && p.phases.length) ? p.phases : inferPhases(p.progress);

      if (sec.progress && p.progress) main += progressCard(p.progress, phases);
      if (sec.progress && phases)     main += doneCard(phases);

      if (sec.actions) {
        var acts = p.actions || [];
        var open = acts.filter(function (a) { return !a.done; });
        main += '<div class="card"><h2>What I need from you right now' +
          (open.length ? ' (' + open.length + ')' : '') + '</h2>';
        main += acts.length ? acts.map(function (a) {
          var late = !a.done && a.due && new Date(a.due) < new Date();
          return '<div class="row' + (a.done ? ' done-row' : '') + '">' +
            '<div class="ic' + (a.done ? ' done' : late ? ' late' : '') + '">' +
            (a.done ? '✓' : late ? '!' : '·') + '</div>' +
            '<div class="body"><strong>' + esc(a.title) + '</strong>' +
            (a.detail ? '<div class="d">' + esc(a.detail) + '</div>' : '') +
            (a.confirm ? '<div class="d" id="confirmWrap-' + i + '-' + a.id + '"><label style="cursor:pointer">' +
              '<input type="checkbox" id="confirmTick-' + i + '-' + a.id + '" data-confirm-action="' + a.id + '" data-confirm-row="' + i + '" style="width:auto;vertical-align:middle;margin-right:6px"> ' +
              'I confirm</label></div>' : '') + '</div>' +
            (a.due ? '<div class="when">' + (a.done ? '' : 'by ') + esc(d(a.due)) + '</div>' : '') +
            '</div>';
        }).join('') : '<p class="empty">Nothing needed from you right now.</p>';
        main += '</div>';
      }

      if (sec.progress && phases) main += journeyCard(phases);

      if (sec.milestones) {
        var ms = p.milestones || [];
        main += '<div class="card"><h2>Key dates</h2>';
        main += ms.length ? ms.map(function (m) {
          return '<div class="row"><div class="ic' + (m.status === 'done' ? ' done' :
            m.status === 'slipped' ? ' late' : '') + '">' +
            (m.status === 'done' ? '✓' : m.status === 'slipped' ? '!' : '·') + '</div>' +
            '<div class="body"><strong>' + esc(m.name) + '</strong>' +
            '<div class="d"><span class="pill ' + esc(m.status || 'planned') + '">' +
            esc(m.status || 'planned') + '</span></div></div>' +
            '<div class="when">' + esc(d(m.date)) + '</div></div>';
        }).join('') : '<p class="empty">No dates set yet.</p>';
        main += '</div>';
      }

      if (sec.answers && (p.answers || []).length) {
        main += '<div class="card"><h2>Your answers</h2>' + p.answers.map(function (a) {
          return '<details><summary>' + esc(a.formTitle) + ' — ' + esc(d(a.completed)) + '</summary>' +
            '<table>' + (a.answers || []).map(function (x) {
              return '<tr><td>' + esc(x.label) + '</td><td>' +
                (x.value ? esc(x.value) : '<span class="tiny">not answered</span>') + '</td></tr>';
            }).join('') + '</table></details>';
        }).join('') + '</div>';
      }

      if (sec.files) {
        main += '<div class="card"><h2>Shared files</h2><div id="files-' + i + '">' +
          '<p class="empty">Loading…</p></div></div>';
      }

      if (sec.messages) {
        html += '<div class="layout"><div>' + main + '</div>' +
          '<aside class="rail">' + messagesCard(i) + '</aside></div>';
      } else {
        html += '<div class="layout solo"><div>' + main + '</div></div>';
      }
    });

    html += '<footer>This page is private to you. Nothing here is public.</footer>';
    app.innerHTML = html;

    var out = document.getElementById('out');
    if (out) out.onclick = function () {
      window.Cloud.signOut().then(function () { signInView('You have been signed out.'); });
    };

    rows.forEach(function (row, i) {
      var host = document.getElementById('files-' + i);
      if (!host) return;
      window.Cloud.listSharedFiles(row.project_id).then(function (files) {
        host.innerHTML = files.length ? files.map(function (f) {
          return '<div class="row"><div class="ic">📄</div><div class="body">' +
            '<strong>' + esc(f.name) + '</strong>' +
            (f.note ? '<div class="d">' + esc(f.note) + '</div>' : '') + '</div>' +
            '<button type="button" class="btn" data-f="' + f.id + '" style="padding:7px 13px;font-size:14px">Open</button></div>';
        }).join('') : '<p class="empty">Nothing shared yet.</p>';

        Array.prototype.forEach.call(host.querySelectorAll('[data-f]'), function (b) {
          b.onclick = function () {
            var rec = files.filter(function (x) { return x.id === b.dataset.f; })[0];
            b.textContent = 'Opening…';
            window.Cloud.sharedFileUrl(rec.path, 300).then(function (u) {
              b.textContent = 'Open';
              window.open(u, '_blank');
            }).catch(function (e) { b.textContent = 'Open'; alert(e.message); });
          };
        });
      }).catch(function () { host.innerHTML = '<p class="empty">Could not load files.</p>'; });
    });

    rows.forEach(function (row, i) {
      var snap = snapshots[i];
      var p = (snap && snap.payload) || {};
      var sec = p.sections || {};

      if (sec.actions) {
        var confirmBoxes = document.querySelectorAll('[data-confirm-row="' + i + '"]');
        if (confirmBoxes.length) {
          window.Cloud.listActionConfirms(row.project_id).then(function (confirms) {
            var done = {};
            confirms.forEach(function (cRec) { done[cRec.action_id] = true; });
            Array.prototype.forEach.call(confirmBoxes, function (box) {
              var actionId = box.dataset.confirmAction;
              if (done[actionId]) {
                box.checked = true;
                box.disabled = true;
                box.parentNode.innerHTML = '✓ You confirmed this';
              } else {
                box.onchange = function () {
                  if (!box.checked) return;
                  box.disabled = true;
                  window.Cloud.confirmAction(row.project_id, actionId).then(function () {
                    box.parentNode.innerHTML = '✓ You confirmed this';
                  }).catch(function (e) {
                    box.disabled = false; box.checked = false;
                    alert('Could not confirm: ' + e.message);
                  });
                };
              }
            });
          }).catch(function () { });
        }
      }

      if (!sec.messages) return;

      var mhost = document.getElementById('msgs-' + i);
      if (!mhost) return;

      function drawMessages() {
        window.Cloud.listMessages(row.project_id).then(function (msgs) {
          mhost.innerHTML = msgs.length ? msgs.map(function (m) {
            return '<div class="msgrow' + (m.from_owner ? '' : ' mine') + '">' +
              '<div class="who">' + (m.from_owner ? 'Sarah' : 'You') + ' · ' +
              esc(new Date(m.created_at).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})) + '</div>' +
              '<div>' + esc(m.body) + '</div></div>';
          }).join('') : '<p class="empty">No messages yet. Say hello.</p>';
          mhost.scrollTop = mhost.scrollHeight;
        }).catch(function () { mhost.innerHTML = '<p class="empty">Could not load messages.</p>'; });
      }
      drawMessages();

      var sendBtn = document.getElementById('msgSend-' + i);
      var bodyEl = document.getElementById('msgBody-' + i);
      if (sendBtn) sendBtn.onclick = function () {
        var body = bodyEl.value.trim();
        if (!body) return;
        sendBtn.disabled = true;
        window.Cloud.sendClientMessage(row.project_id, body).then(function () {
          bodyEl.value = ''; sendBtn.disabled = false;
          drawMessages();
        }).catch(function (e) { sendBtn.disabled = false; alert('Could not send: ' + e.message); });
      };

      var attachBtn = document.getElementById('msgAttach-' + i);
      var fileEl = document.getElementById('msgFile-' + i);
      var cuHost = document.getElementById('cuList-' + i);

      function drawClientUploads() {
        window.Cloud.listClientUploads(row.project_id).then(function (files) {
          cuHost.innerHTML = files.length ? files.map(function (f) {
            return '<div class="cuitem"><span>📎 ' + esc(f.name) + '</span>' +
              '<button type="button" class="btn" data-cu="' + f.id + '" style="padding:5px 11px;font-size:13px">Open</button></div>';
          }).join('') : '';
          Array.prototype.forEach.call(cuHost.querySelectorAll('[data-cu]'), function (b) {
            b.onclick = function () {
              var rec = files.filter(function (x) { return x.id === b.dataset.cu; })[0];
              b.textContent = 'Opening…';
              window.Cloud.clientUploadUrl(rec.path).then(function (u) {
                b.textContent = 'Open'; window.open(u, '_blank');
              }).catch(function (e) { b.textContent = 'Open'; alert(e.message); });
            };
          });
        }).catch(function () { });
      }
      drawClientUploads();

      if (attachBtn) attachBtn.onclick = function () { fileEl.value = ''; fileEl.click(); };
      if (fileEl) fileEl.onchange = function () {
        var f = fileEl.files && fileEl.files[0];
        if (!f) return;
        attachBtn.textContent = 'Uploading…';
        window.Cloud.uploadClientFile(row.project_id, f).then(function () {
          attachBtn.textContent = 'Attach a file';
          drawClientUploads();
        }).catch(function (e) {
          attachBtn.textContent = 'Attach a file';
          alert('Upload failed: ' + e.message);
        });
      };
    });
  }

  function start() {
    if (!window.Cloud || !window.Cloud.configured()) {
      app.innerHTML = '<div class="signin card"><h1>Not set up yet</h1>' +
        '<p class="sub">This client area has not been configured. Please contact whoever sent you this link.</p></div>';
      return;
    }
    window.Cloud.init().then(function () {
      var u = window.Cloud.user();
      if (!u) { signInView(); return; }

      /* ---------- Preview as client ----------
         ?preview=<projectId> renders this page from the project's published
         snapshot, read as the OWNER. Row-level security already lets an owner
         read their own snapshot, so no client sign-in and no magic link is
         needed. Nothing is written: last_seen_at is deliberately not touched,
         so a preview never shows up as the client having opened it. */
      var previewId = null;
      try { previewId = new URLSearchParams(location.search).get('preview'); } catch (e) { previewId = null; }
      if (previewId) {
        window.Cloud.getSnapshot(previewId).then(function (snap) {
          render([{ id: 'preview', project_id: previewId, display_name: 'Preview' }], [snap]);
          if (document.getElementById('previewBar')) return;
          var bar = document.createElement('div');
          bar.id = 'previewBar';
          bar.style.cssText = 'position:sticky;top:0;z-index:50;background:#0a0a0c;color:#f6f3ed;' +
            'padding:10px 16px;font:600 14px/1.4 system-ui,-apple-system,sans-serif;' +
            'display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap';
          bar.innerHTML = '<span>Preview — this is exactly what your client sees. ' +
            'Nothing here is recorded against them.</span>' +
            '<a href="app.html" style="color:#ffb020">← Back to the app</a>';
          document.body.insertBefore(bar, document.body.firstChild);
        }).catch(function (e) {
          app.innerHTML = '<div class="signin card"><h1>Could not preview</h1>' +
            '<p class="sub err">' + esc(e.message) + '</p></div>';
        });
        return;
      }

      window.Cloud.myClientProjects().then(function (rows) {
        if (!rows.length) { notInvited(u.email); return; }
        rows.forEach(function (r) { window.Cloud.touchClientSeen(r.id); });
        return Promise.all(rows.map(function (r) {
          return window.Cloud.getSnapshot(r.project_id).catch(function () { return null; });
        })).then(function (snaps) { render(rows, snaps); });
      }).catch(function (e) {
        app.innerHTML = '<div class="signin card"><h1>Something went wrong</h1>' +
          '<p class="sub err">' + esc(e.message) + '</p>' +
          '<div style="margin-top:16px"><button type="button" class="btn" onclick="location.reload()">Try again</button></div></div>';
      });
    });
  }

  window.Cloud.onChange(function () { start(); });
  start();
})();
</script>
</body>
</html>
