<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dragon Fire">
  <title>Dragon Fire</title>
  <rect width="64" height="64" rx="12" fill="#0a0a0c"/>
  <path fill="#ffb020" d="M40 22 Q49 15 57 16 Q48 20 43 27 Z"/>
  <path fill="#ff3b1f" d="M20 29 L34 23 Q42 20 46 26 Q49 30 48 36 L34 33 L20 31 Z"/>
  <path fill="#c2260e" d="M21 36 L35 38 L47 39 Q45 47 35 47 Q25 45 21 38 Z"/>
  <path fill="#f6f3ed" d="M28 31 l2.6 3.6 1.8-3.6 z"/>
  <path fill="#f6f3ed" d="M37 32 l2.6 3.6 1.8-3.6 z"/>
  <path fill="#f6f3ed" d="M32 38 l-2.6-3.6 -1.8 3.6 z"/>
  <circle cx="40" cy="29" r="3" fill="#ffb020"/>
  <circle cx="41" cy="29" r="1.3" fill="#0a0a0c"/>
  <g class="df-flame">
    <path fill="#ff3b1f" d="M21 33 L3 24 Q9 33 3 42 Z"/>
    <path fill="#ff8a1f" d="M21 33 L8 27 Q12 33 8 39 Z"/>
    <path fill="#ffd35c" d="M21 33 L14 30 Q16 33 14 36 Z"/>
  </g>
  <style>
    .df-flame{transform-origin:21px 33px;animation:dfFlicker 1.1s ease-in-out infinite}
    @keyframes dfFlicker{
      0%,100%{transform:scaleX(1) scaleY(1)}
      35%{transform:scaleX(1.14) scaleY(.88)}
      70%{transform:scaleX(.92) scaleY(1.1)}
    }
    @media (prefers-reduced-motion: reduce){.df-flame{animation:none}}
  </style>
</svg>
